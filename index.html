<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --night:#1b1020; --plum:#2a1830; --rose:#e9b7bd; --rose-deep:#c9737f;
  --gold:#dcb98a; --ivory:#fbf2ea; --muted:#b9a5b4;
  --serif:'Cormorant Garamond',Georgia,serif; --sans:'Jost',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--night);color:var(--ivory);font-family:var(--sans);font-weight:300;line-height:1.7;overflow-x:hidden}
body.locked{overflow:hidden}
canvas#hearts{position:fixed;inset:0;pointer-events:none;z-index:0}
main,header,footer{position:relative;z-index:1}

/* ---------- Buttons ---------- */
.btn{font-family:var(--sans);font-size:1rem;font-weight:400;letter-spacing:.04em;cursor:pointer;border-radius:999px;padding:.85rem 2rem;border:1px solid var(--rose);color:var(--ivory);background:transparent;transition:.3s}
.btn:hover{background:var(--rose);color:var(--night)}
.btn.primary{background:linear-gradient(135deg,var(--rose),var(--rose-deep));border-color:transparent;color:#2a1020;font-weight:500;box-shadow:0 8px 30px rgba(201,115,127,.35)}
.btn.primary:hover{transform:translateY(-2px);box-shadow:0 12px 36px rgba(201,115,127,.5)}
.btn:focus-visible,.icon-btn:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* ---------- Password gate ---------- */
.gate{position:fixed;inset:0;z-index:200;display:grid;place-items:center;text-align:center;padding:2rem;
  background:radial-gradient(circle at 50% 35%,#3a1f40 0%,var(--night) 72%);transition:opacity 1s,visibility 1s}
.gate.hide{opacity:0;visibility:hidden}
.gate-box{max-width:30rem;width:100%}
.gate h1{font-family:var(--serif);font-weight:400;font-size:clamp(2.2rem,8vw,3.6rem);line-height:1.1;margin:.8rem 0}
.gate p{color:var(--muted);margin-bottom:1.6rem}
.gate form{display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap}
.gate input{font:inherit;font-size:1rem;padding:.85rem 1.4rem;border-radius:999px;border:1px solid rgba(233,183,189,.45);background:rgba(42,24,48,.8);color:var(--ivory);text-align:center;min-width:14rem;letter-spacing:.08em}
.gate input:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.gate .err{color:var(--rose);min-height:1.6rem;margin:1rem 0 0}
.gate form.shake{animation:shake .45s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.wait h2{font-family:var(--serif);font-weight:400;font-style:italic;font-size:clamp(1.8rem,6vw,2.6rem);color:var(--gold);margin-bottom:.8rem}
.wait .counter{margin:1.8rem 0 0}

/* ---------- Cover ---------- */
.cover{position:fixed;inset:0;z-index:50;display:grid;place-items:center;text-align:center;padding:2rem;
  background:radial-gradient(circle at 50% 40%,#3a1f40 0%,var(--night) 70%);transition:opacity 1s,visibility 1s}
.cover.hide{opacity:0;visibility:hidden}
.cover h1{font-family:var(--serif);font-weight:400;font-size:clamp(2.6rem,9vw,6rem);line-height:1.05;margin:1rem 0}
.cover h1 em{color:var(--rose)}
.cover p{color:var(--muted);max-width:30rem;margin:0 auto 2rem}
.pulse{font-size:3rem;color:var(--rose-deep);animation:beat 1.6s infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.18)}}

/* ---------- Hero ---------- */
.hero{min-height:calc(100vh - 4.5rem);display:grid;place-items:center;text-align:center;padding:4rem 1.5rem}
.hero .names{font-family:var(--serif);font-style:italic;font-size:clamp(1.3rem,3vw,1.8rem);color:var(--gold)}
.hero h2{font-family:var(--serif);font-weight:400;font-size:clamp(2.4rem,8vw,5.5rem);line-height:1.1;margin:.6rem 0 1.2rem}
.hero p{color:var(--muted);max-width:34rem;margin:0 auto 2.2rem;font-size:1.1rem}
.counter{display:flex;gap:clamp(.8rem,3vw,2rem);justify-content:center;margin-bottom:2.5rem;flex-wrap:wrap}
.counter div{min-width:4.6rem}
.counter b{display:block;font-family:var(--serif);font-size:clamp(2rem,6vw,3rem);font-weight:400;color:var(--rose)}
.counter span{font-size:.85rem;color:var(--muted)}

/* ---------- Timeline ---------- */
.timeline{max-width:980px;margin:0 auto;padding:2rem 1.5rem 4rem;position:relative}
.timeline::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:linear-gradient(var(--night),var(--rose-deep) 8%,var(--rose-deep) 92%,var(--night))}
.chapter{position:relative;padding:3rem 0 4rem;opacity:0;transform:translateY(30px);transition:opacity .9s,transform .9s}
.chapter.in{opacity:1;transform:none}
.chapter::before{content:"♥";position:absolute;left:50%;top:3rem;transform:translateX(-50%);background:var(--night);color:var(--rose-deep);padding:.3rem 0;font-size:1.3rem}
.date{text-align:center;margin-bottom:2.5rem}
.date time{display:inline-block;margin-top:2.4rem;font-family:var(--serif);font-style:italic;font-size:1.5rem;color:var(--gold);background:var(--night);padding:0 1rem}
.date h3{font-family:var(--serif);font-weight:400;font-size:clamp(2rem,5vw,3.2rem);line-height:1.15;margin-top:.2rem;background:var(--night);display:inline-block;padding:0 1rem}
.story{max-width:38rem;margin:0 auto 2.5rem;text-align:center;font-size:1.1rem;color:#e6d6dd;background:var(--night)}

.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin-bottom:2rem}
.photo{position:relative;aspect-ratio:4/5;overflow:hidden;border-radius:6px;cursor:zoom-in;border:0;background:var(--plum);padding:0}
.photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s}
.photo:hover img{transform:scale(1.06)}
.photo.empty{display:grid;place-items:center;color:var(--rose-deep);font-size:2.2rem;background:linear-gradient(160deg,var(--plum),#3a2040);cursor:default}
.photo figcaption,.photo .cap{position:absolute;left:0;right:0;bottom:0;padding:1.6rem .9rem .7rem;font-size:.9rem;text-align:left;background:linear-gradient(transparent,rgba(20,8,24,.85));color:var(--ivory)}

/* ---------- Music player ---------- */
.player{display:flex;align-items:center;gap:1rem;max-width:30rem;margin:0 auto;padding:.8rem 1.2rem;border:1px solid rgba(233,183,189,.35);border-radius:999px;background:rgba(42,24,48,.8);backdrop-filter:blur(6px)}
.icon-btn{width:2.8rem;height:2.8rem;flex:none;border-radius:50%;border:0;cursor:pointer;background:linear-gradient(135deg,var(--rose),var(--rose-deep));color:#2a1020;font-size:1rem;transition:.25s}
.icon-btn:hover{transform:scale(1.08)}
.player .meta{flex:1;min-width:0}
.player .meta strong{display:block;font-weight:400;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:3px;border-radius:3px;background:rgba(255,255,255,.15);margin-top:.35rem;cursor:pointer}
.bar i{display:block;height:100%;width:0;background:var(--gold);border-radius:3px}

/* ---------- Finale ---------- */
.finale{text-align:center;padding:6rem 1.5rem 7rem}
.finale h2{font-family:var(--serif);font-weight:400;font-size:clamp(2.2rem,6vw,4rem);margin-bottom:1.5rem}
.letter{max-width:38rem;margin:0 auto;max-height:0;overflow:hidden;opacity:0;transition:max-height 1.2s,opacity 1.2s,margin 1.2s;font-family:var(--serif);font-size:1.45rem;font-style:italic;line-height:1.6;color:var(--ivory)}
.letter.open{max-height:1400px;opacity:1;margin:2.5rem auto;padding:2.4rem 2rem;border:1px solid rgba(220,185,138,.5);border-radius:10px;background:linear-gradient(160deg,#2f1a35,#231229);box-shadow:0 20px 60px rgba(0,0,0,.45);text-align:left}
.letter .to{display:block;font-style:normal;color:var(--rose);margin-bottom:1rem;font-size:1.8rem}
.letter .body{white-space:pre-line}
.letter .sign{display:block;margin-top:1.5rem;color:var(--gold);font-style:normal}
.video{max-width:44rem;margin:0 auto 2.5rem}
.video video{width:100%;max-height:75vh;border-radius:10px;background:#000;box-shadow:0 20px 60px rgba(0,0,0,.5);border:1px solid rgba(220,185,138,.4)}
.video figcaption{margin-top:.8rem;color:var(--muted);font-family:var(--serif);font-style:italic;font-size:1.15rem}
footer{text-align:center;padding:2rem;color:var(--muted);font-size:.85rem}

/* ---------- Lightbox ---------- */
.lightbox{position:fixed;inset:0;z-index:100;background:rgba(14,6,18,.94);display:none;place-items:center;padding:1rem}
.lightbox.open{display:grid}
.lightbox img{max-width:92vw;max-height:80vh;border-radius:6px;box-shadow:0 20px 60px #000}
.lightbox p{text-align:center;margin-top:.8rem;color:var(--muted)}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%)}
.lb-prev{left:1rem}.lb-next{right:1rem}.lb-close{position:absolute;top:1rem;right:1rem}

/* ---------- Menu ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:70;display:flex;align-items:center;justify-content:space-between;padding:.8rem clamp(1rem,4vw,2.5rem);background:rgba(27,16,32,.75);backdrop-filter:blur(10px);border-bottom:1px solid rgba(233,183,189,.15)}
.nav[hidden]{display:none}
.nav .brand{font-family:var(--serif);font-size:1.7rem;font-style:italic;color:var(--rose);background:none;border:0;cursor:pointer}
.nav ul{display:flex;gap:.2rem;list-style:none}
.nav li button{font:inherit;color:var(--muted);background:none;border:0;padding:.5rem 1rem;cursor:pointer;position:relative;transition:color .3s}
.nav li button::after{content:"";position:absolute;left:1rem;right:1rem;bottom:.2rem;height:1px;background:var(--gold);transform:scaleX(0);transition:transform .4s}
.nav li button:hover,.nav li button.on{color:var(--ivory)}
.nav li button.on::after{transform:scaleX(1)}
.nav button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.burger{display:none;width:2.4rem;height:2.4rem}

/* ---------- Pages (views) + heart curtain transition ---------- */
.view{display:none;min-height:100vh;padding-top:4.5rem}
.view.active{display:block;animation:viewin .9s both}
@keyframes viewin{from{opacity:0}to{opacity:1}}
.curtain{position:fixed;inset:0;z-index:150;pointer-events:none;display:grid;place-items:center;background:radial-gradient(circle,#c9737f,#6e2f52);clip-path:circle(0% at var(--x,50%) var(--y,50%));transition:clip-path .8s cubic-bezier(.77,0,.18,1)}
.curtain.on{clip-path:circle(150% at var(--x,50%) var(--y,50%));pointer-events:all}
.curtain span{font-size:5rem;color:var(--ivory);opacity:0;transform:scale(.4);transition:.5s .3s}
.curtain.on span{opacity:1;transform:scale(1)}
.page-head{text-align:center;padding:3rem 1.5rem 1.5rem}
.page-head h2{font-family:var(--serif);font-weight:400;font-size:clamp(2.2rem,6vw,3.8rem)}
.page-head p{color:var(--muted);max-width:32rem;margin:.6rem auto 0}
.hero .btns{display:flex;gap:.9rem;justify-content:center;flex-wrap:wrap}

/* About */
.about{max-width:1000px;margin:0 auto;padding:1.5rem 1.5rem 3rem;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:3rem;align-items:center}
.portrait{aspect-ratio:4/5;border-radius:220px 220px 10px 10px;overflow:hidden;border:1px solid rgba(220,185,138,.5);background:linear-gradient(160deg,var(--plum),#3a2040);display:grid;place-items:center;font-size:3.5rem;color:var(--rose-deep)}
.portrait img{width:100%;height:100%;object-fit:cover}
.about .intro{font-size:1.15rem;color:#e6d6dd;white-space:pre-line}
.facts{margin-top:1.5rem;display:grid;grid-template-columns:1fr 1fr;gap:.9rem 1.5rem}
.facts dt{color:var(--gold);font-family:var(--serif);font-style:italic;font-size:1.1rem}
.facts dd{margin:0}
.reasons{max-width:1000px;margin:0 auto;padding:0 1.5rem 5rem;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1.2rem}
.reason{padding:1.6rem;border-left:2px solid var(--rose-deep);background:rgba(42,24,48,.6)}
.reason h4{font-family:var(--serif);font-weight:400;font-size:1.5rem;margin-bottom:.4rem}
.reason p{color:var(--muted)}

/* Gallery */
.chips{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;padding:1rem 1.5rem 2rem}
.chip{padding:.5rem 1.2rem;font-size:.9rem}
.chip.on{background:var(--rose);color:var(--night)}
.mosaic{max-width:1100px;margin:0 auto;padding:0 1.5rem 5rem;columns:3 240px;column-gap:1rem}
.mosaic .photo{display:block;width:100%;margin-bottom:1rem;break-inside:avoid;aspect-ratio:4/5}
.mosaic .photo:nth-child(3n+1){aspect-ratio:3/4}
.mosaic .photo:nth-child(3n+2){aspect-ratio:1}

@media (max-width:760px){
  .burger{display:grid}
  .nav ul{position:absolute;top:100%;left:0;right:0;flex-direction:column;background:rgba(27,16,32,.97);padding:.6rem 1rem 1rem;display:none}
  .nav ul.open{display:flex}
  .about{grid-template-columns:1fr;gap:2rem}
}

/* Floating mute button */
.fab{position:fixed;right:1rem;bottom:1rem;z-index:60}

@media (max-width:640px){
  .timeline::before,.chapter::before{left:1.2rem}
  .chapter::before{transform:none}
  .date,.story{text-align:left;padding-left:2.2rem}
  .date time,.date h3{padding-left:0}
  .gallery{grid-template-columns:repeat(2,1fr)}
  .player{margin-left:2.2rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.chapter{opacity:1;transform:none}}
</style>
</head>
<body class="locked">
<canvas id="hearts" aria-hidden="true"></canvas>

  intro: "Write about Aya here. Who she is, what makes her special, and what she means to you.\n\nYou can write more than one paragraph.",
  facts: [                                   // add or remove lines freely
    ["Birthday", "26 December"],
    ["Favourite colour", "Write here"],
    ["Favourite song", "Write here"],
    ["Her superpower", "Write here"]
  ],
  reasons: [                                 // the cards under the about section
    { title: "Your smile",   text: "Write why you love it." },
    { title: "Your heart",    text: "Write why you love it." },
    { title: "Your laugh",    text: "Write why you love it." }
  ]
};
/* ============================ END OF EDIT ZONE ============================ */


/* ---------- Fill in the page ---------- */
const $ = id => document.getElementById(id);
$('coverTitle').innerHTML = SITE.coverTitle;
$('coverSub').textContent = SITE.coverSub;
$('names').textContent = SITE.names;
$('heroTitle').textContent = SITE.heroTitle;
$('heroText').textContent = SITE.heroText;
$('finaleTitle').textContent = SITE.finaleTitle;
$('footer').textContent = SITE.footer + " ♥";
$('letter').innerHTML = '<span class="to"></span><span class="body"></span><span class="sign"></span>';
$('letter').querySelector('.to').textContent = SITE.cardTo;
$('letter').querySelector('.sign').textContent = SITE.signature;
document.title = SITE.names;

/* ---------- About + page titles ---------- */
$('aboutTitle').textContent = SITE.pages.about.title; $('aboutSub').textContent = SITE.pages.about.sub;
$('reasonsTitle').textContent = SITE.pages.reasons;
$('storyTitle').textContent = SITE.pages.story.title; $('storySub').textContent = SITE.pages.story.sub;
$('galleryTitle').textContent = SITE.pages.gallery.title; $('gallerySub').textContent = SITE.pages.gallery.sub;
$('aboutIntro').textContent = ABOUT.intro;
(function(){
  const im = new Image(); im.src = ABOUT.photo; im.alt = 'Aya';
  im.onerror = () => { $('portrait').textContent = '♥'; };
  $('portrait').appendChild(im);
  ABOUT.facts.forEach(([k,v]) => { const dt = document.createElement('dt'), dd = document.createElement('dd'); dt.textContent = k; dd.textContent = v; $('facts').append(dt, dd); });
  ABOUT.reasons.forEach(r => { const d = document.createElement('div'); d.className = 'reason'; d.innerHTML = '<h4></h4><p></p>'; d.querySelector('h4').textContent = r.title; d.querySelector('p').textContent = r.text; $('reasons').appendChild(d); });
})();

/* ---------- Counter ---------- */
function tick(){
  const start = new Date(SITE.togetherSince + 'T00:00:00');
  let d = Math.max(0, Date.now() - start);
  const days = Math.floor(d / 864e5), h = Math.floor(d / 36e5) % 24,
        m = Math.floor(d / 6e4) % 60, s = Math.floor(d / 1e3) % 60;
  $('counter').innerHTML = [[days,'days'],[h,'hours'],[m,'minutes'],[s,'seconds']]
    .map(([n,l]) => `<div><b>${n}</b><span>${l}</span></div>`).join('');
}
tick(); setInterval(tick, 1000);

/* ---------- Photos + lightbox ---------- */
const allPhotos = [];           // flat list for the lightbox, per chapter
let lbList = [], lbIndex = 0;

/* ---------- Timeline ---------- */
const audios = [];
const fmt = t => isFinite(t) ? Math.floor(t/60) + ':' + String(Math.floor(t%60)).padStart(2,'0') : '0:00';

CHAPTERS.forEach((c, ci) => {
  const sec = document.createElement('article');
  sec.className = 'chapter';
  sec.innerHTML = `
    <div class="date"><time></time><br><h3></h3></div>
    <p class="story"></p>
    <div class="gallery"></div>
    <div class="player">
      <button class="icon-btn" aria-label="Play song">▶</button>
      <div class="meta"><strong></strong><div class="bar"><i></i></div></div>
      <span class="time" style="font-size:.8rem;color:var(--muted)">0:00</span>
    </div>`;
  sec.querySelector('time').textContent = c.date;
  sec.querySelector('h3').textContent = c.title;
  sec.querySelector('.story').textContent = c.text;

  // photos
  const gal = sec.querySelector('.gallery');
  const list = c.photos || [];
  list.forEach((ph, pi) => {
    const b = document.createElement('button');
    b.className = 'photo'; b.type = 'button';
    b.setAttribute('aria-label', ph.caption || 'Open photo');
    const img = new Image();
    img.src = ph.src; img.alt = ph.caption || ''; img.loading = 'lazy';
    img.onerror = () => { b.className = 'photo empty'; b.textContent = '♥'; b.onclick = null; };
    b.appendChild(img);
    if (ph.caption){ const cap = document.createElement('span'); cap.className = 'cap'; cap.textContent = ph.caption; b.appendChild(cap); }
    b.onclick = () => openLB(list, pi);
    gal.appendChild(b);
  });

  // music
  const player = sec.querySelector('.player');
  if (c.music && c.music.src){
    const a = new Audio(c.music.src); a.preload = 'none'; a.loop = true;
    audios.push(a);
    const btn = player.querySelector('button'), bar = player.querySelector('.bar'),
          fill = bar.querySelector('i'), tm = player.querySelector('.time');
    player.querySelector('strong').textContent = c.music.title || 'Our song';
    btn.onclick = () => {
      if (a.paused){ audios.forEach(o => o !== a && o.pause()); a.play().catch(()=>{ player.querySelector('strong').textContent = 'Add your song to the music folder'; }); }
      else a.pause();
    };
    a.onplay  = () => { btn.textContent = '❚❚'; btn.setAttribute('aria-label','Pause song'); current = a; };
    a.onpause = () => { btn.textContent = '▶';  btn.setAttribute('aria-label','Play song'); };
    a.ontimeupdate = () => { fill.style.width = (a.currentTime / a.duration * 100 || 0) + '%'; tm.textContent = fmt(a.currentTime); };
    bar.onclick = e => { const r = bar.getBoundingClientRect(); if (a.duration) a.currentTime = (e.clientX - r.left) / r.width * a.duration; };
    sec._audio = a;
  } else player.remove();

  $('timeline').appendChild(sec);
});

/* Auto-play each chapter's song when it scrolls into view (after the cover click) */
let current = null, autoplay = false;
const io = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (!e.isIntersecting) return;
    e.target.classList.add('in');
  });
}, { threshold: .15 });
document.querySelectorAll('.chapter').forEach(el => io.observe(el));

/* ---------- Gallery (all photos, with filters) ---------- */
const flat = [];
CHAPTERS.forEach(c => (c.photos || []).forEach(ph => flat.push({ src: ph.src, caption: ph.caption, ch: c.title })));
function drawGallery(filter){
  const m = $('mosaic'); m.innerHTML = '';
  const list = flat.filter(ph => filter === 'all' || ph.ch === filter);
  list.forEach((ph, i) => {
    const b = document.createElement('button'); b.className = 'photo'; b.type = 'button';
    b.setAttribute('aria-label', ph.caption || 'Open photo');
    const img = new Image(); img.src = ph.src; img.alt = ph.caption || ''; img.loading = 'lazy';
    img.onerror = () => { b.className = 'photo empty'; b.textContent = '♥'; b.onclick = null; };
    b.appendChild(img);
    if (ph.caption){ const cap = document.createElement('span'); cap.className = 'cap'; cap.textContent = ph.caption; b.appendChild(cap); }
    b.onclick = () => openLB(list, i);
    m.appendChild(b);
  });
}
['all', ...CHAPTERS.map(c => c.title)].forEach(f => {
  const b = document.createElement('button'); b.className = 'btn chip' + (f === 'all' ? ' on' : ''); b.textContent = f === 'all' ? 'All photos' : f;
  b.onclick = () => { document.querySelectorAll('.chip').forEach(x => x.classList.remove('on')); b.classList.add('on'); drawGallery(f); };
  $('chips').appendChild(b);
});
drawGallery('all');

/* ---------- Menu + heart-curtain page transition ---------- */
let view = 'home', busy = false;
function go(name, ev){
  if (busy || name === view){ $('navList').classList.remove('open'); return; }
  busy = true;
  const c = $('curtain');
  c.style.setProperty('--x', (ev && ev.clientX ? ev.clientX : innerWidth/2) + 'px');
  c.style.setProperty('--y', (ev && ev.clientY ? ev.clientY : innerHeight/2) + 'px');
  c.classList.add('on');
  setTimeout(() => {
    document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + name));
    document.querySelectorAll('#navList [data-go]').forEach(b => b.classList.toggle('on', b.dataset.go === name));
    view = name; scrollTo(0, 0); $('navList').classList.remove('open');
    c.style.setProperty('--x', '50%'); c.style.setProperty('--y', '50%');
    c.classList.remove('on');
    setTimeout(() => busy = false, 800);
  }, 950);
}
document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', e => go(b.dataset.go, e)));
$('burger').onclick = () => $('navList').classList.toggle('open');

/* ---------- Lightbox ---------- */
function openLB(list, i){ lbList = list; lbIndex = i; showLB(); $('lightbox').classList.add('open'); }
function showLB(){ const p = lbList[lbIndex]; $('lbImg').src = p.src; $('lbImg').alt = p.caption || ''; $('lbCap').textContent = p.caption || ''; }
function stepLB(d){ lbIndex = (lbIndex + d + lbList.length) % lbList.length; showLB(); }
$('lbClose').onclick = () => $('lightbox').classList.remove('open');
$('lbPrev').onclick = () => stepLB(-1);
$('lbNext').onclick = () => stepLB(1);
$('lightbox').onclick = e => { if (e.target.id === 'lightbox') $('lightbox').classList.remove('open'); };
document.addEventListener('keydown', e => {
  if (!$('lightbox').classList.contains('open')) return;
  if (e.key === 'Escape') $('lightbox').classList.remove('open');
  if (e.key === 'ArrowLeft') stepLB(-1);
  if (e.key === 'ArrowRight') stepLB(1);
});

/* ---------- Cover + floating music button ---------- */
$('startBtn').onclick = () => {
  $('cover').classList.add('hide');
  document.body.classList.remove('locked');
  $('muteBtn').hidden = false; $('nav').hidden = false;
  const first = audios[0];
  if (first){ first.play().catch(()=>{}); }
  burst(innerWidth/2, innerHeight/2, 40);
};
$('muteBtn').onclick = () => {
  const playing = audios.find(a => !a.paused);
  if (playing){ playing.pause(); $('muteBtn').textContent = '✕'; }
  else { (current || audios[0])?.play().catch(()=>{}); $('muteBtn').textContent = '♪'; }
};

/* ---------- Letter ---------- */
$('letterBtn').onclick = e => {
  $('letter').classList.toggle('open');
  const open = $('letter').classList.contains('open');
  e.target.textContent = open ? 'Close the card' : 'Open your birthday card';
  if (open){
    const r = e.target.getBoundingClientRect(); burst(r.left + r.width/2, r.top, 60);
    typeCard();
  }
};

/* ---------- Final video ---------- */
if (SITE.video && SITE.video.src){
  const v = $('finalVideo');
  v.src = SITE.video.src;
  if (SITE.video.poster) v.poster = SITE.video.poster;
  $('videoCap').textContent = SITE.video.caption || '';
  $('videoBox').hidden = false;
  v.onerror = () => { $('videoBox').hidden = true; };
  let resume = null;
  v.onplay  = () => { resume = audios.find(a => !a.paused) || null; audios.forEach(a => a.pause()); };
  v.onpause = () => { if (resume && !v.seeking){ resume.play().catch(()=>{}); resume = null; } };
}

/* Typewriter effect for the card */
let typed = false;
function typeCard(){
  if (typed) return; typed = true;
  const el = $('letter').querySelector('.body'); let i = 0;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches){ el.textContent = SITE.letter; return; }
  (function next(){ el.textContent = SITE.letter.slice(0, ++i); if (i < SITE.letter.length) setTimeout(next, 32); })();
}

/* ---------- Password gate ---------- */
$('gateTitle').textContent = SITE.gateTitle;
$('gateSub').textContent = SITE.gateSub;
$('waitTitle').textContent = SITE.waitTitle;
$('waitText').textContent = SITE.waitText;
$('waitOpen').textContent = SITE.waitReadyBtn;
const birthday = new Date(SITE.birthday);
const isOpen = () => SITE.previewMode || Date.now() >= birthday.getTime();

function unlockPage(){
  $('gate').classList.add('hide');
  burst(innerWidth/2, innerHeight/2, 30);
}
function waitTick(){
  const d = Math.max(0, birthday - Date.now());
  const days = Math.floor(d/864e5), h = Math.floor(d/36e5)%24, m = Math.floor(d/6e4)%60, s = Math.floor(d/1e3)%60;
  $('waitCounter').innerHTML = [[days,'days'],[h,'hours'],[m,'minutes'],[s,'seconds']]
    .map(([n,l]) => `<div><b>${n}</b><span>${l}</span></div>`).join('');
  if (d === 0){
    clearInterval(waitTimer);
    $('waitTitle').textContent = SITE.wakeTitle;
    $('waitText').textContent = SITE.wakeText;
    $('waitCounter').hidden = true;
    burst(innerWidth/2, innerHeight/2, 60);
    setTimeout(unlockPage, 3500);          // opens by itself
    $('waitOpen').hidden = false;          // or she can tap
  }
}
let waitTimer = null;
$('waitOpen').onclick = unlockPage;
$('gateForm').onsubmit = e => {
  e.preventDefault();
  const typedPw = $('pw').value.trim().toLowerCase();
  if (typedPw !== SITE.password.toLowerCase()){
    $('gateErr').textContent = SITE.wrongPassword;
    const f = $('gateForm'); f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake');
    return;
  }
  $('gateErr').textContent = '';
  if (isOpen()){ unlockPage(); return; }
  // Right word, but too early: show the waiting message with a live countdown
  $('gateForm').hidden = true;
  $('gateSub').hidden = true;
  $('wait').hidden = false;
  waitTick(); waitTimer = setInterval(waitTick, 1000);
};

/* ---------- Floating hearts + burst ---------- */
const cv = $('hearts'), cx = cv.getContext('2d');
let W, H, parts = [];
const resize = () => { W = cv.width = innerWidth; H = cv.height = innerHeight; };
resize(); addEventListener('resize', resize);
const colors = ['#e9b7bd','#c9737f','#dcb98a'];
function spawn(x, y, burstMode){
  parts.push({
    x, y, s: 8 + Math.random()*14,
    vx: burstMode ? (Math.random()-.5)*7 : (Math.random()-.5)*.3,
    vy: burstMode ? -Math.random()*7 - 1 : -(.3 + Math.random()*.6),
    a: burstMode ? 1 : .15 + Math.random()*.25,
    life: burstMode ? 120 : Infinity, burst: burstMode,
    c: colors[Math.floor(Math.random()*colors.length)]
  });
}
function burst(x, y, n){ for (let i=0;i<n;i++) spawn(x, y, true); }
function heart(p){
  cx.save(); cx.translate(p.x, p.y); cx.scale(p.s/20, p.s/20);
  cx.globalAlpha = p.a; cx.fillStyle = p.c; cx.beginPath();
  cx.moveTo(0,6); cx.bezierCurveTo(-14,-4,-8,-16,0,-8); cx.bezierCurveTo(8,-16,14,-4,0,6); cx.fill(); cx.restore();
}
function loop(){
  cx.clearRect(0,0,W,H);
  if (parts.length < 22 && Math.random() < .03) spawn(Math.random()*W, H + 20, false);
  parts = parts.filter(p => p.y > -30 && p.life > 0);
  parts.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    if (p.burst){ p.vy += .15; p.life--; p.a = Math.max(0, p.life/120); }
    heart(p);
  });
  requestAnimationFrame(loop);
}
if (!matchMedia('(prefers-reduced-motion: reduce)').matches) loop();
</script>
